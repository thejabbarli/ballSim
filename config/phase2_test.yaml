# BallSim Configuration - Phase 2 Test
# Multiple balls with obstacles

# -------------------------------------------------------------------
# SIMULATION SETTINGS
# -------------------------------------------------------------------

simulation:
  duration_seconds: 8
  substeps: 4

# -------------------------------------------------------------------
# OUTPUT SETTINGS
# -------------------------------------------------------------------

output:
  width: 1280
  height: 720
  fps: 60
  path: "output/multi_ball.mp4"
  codec: libx264
  bitrate: "8M"

# -------------------------------------------------------------------
# PHYSICS SETTINGS
# -------------------------------------------------------------------

physics:
  gravity: [0, 980]
  integrator: euler

# -------------------------------------------------------------------
# VISUAL SETTINGS
# -------------------------------------------------------------------

background:
  color: "#000000"

# -------------------------------------------------------------------
# BOUNDARIES
# -------------------------------------------------------------------

boundaries:
  - type: circle
    id: outer_circle
    center: [640, 360]
    radius: 340
    color: "#ffffff"
    thickness: 5
    is_containment: true
    hue_shift: continuous
    hue_shift_speed: 45

  - type: circle
    id: inner_obstacle
    center: [640, 360]
    radius: 60
    color: "#e74c3c"
    thickness: 2
    is_containment: false
    hue_shift: on_contact
    hue_shift_amount: 60

# -------------------------------------------------------------------
# BALLS
# -------------------------------------------------------------------

balls:
  - id: ball_1
    radius: 20
    color: "#e74c3c"
    position: [500, 100]
    velocity: [200, 50]
    restitution: 0.99
    mass: 1.0
    hue_shift: continuous
    hue_shift_speed: 90
    outline: false
    outline_color: "#ffffff"
    outline_thickness: 2
    glow: false
    glow_radius: 30
    glow_intensity: 0.6
    # glow_color: "#ff0000"  # omit to use ball's current color (follows hue shift)

  - id: ball_2
    radius: 20
    color: "#2ecc71"
    position: [780, 120]
    velocity: [-150, 80]
    restitution: 0.99
    mass: 1.0
    hue_shift: on_bounce
    hue_shift_amount: 45
    glow: true
    glow_radius: 30
    glow_intensity: 0.6

  - id: ball_3
    radius: 30
    color: "#2eac11"
    position: [580, 120]
    velocity: [-150, 80]
    restitution: 0.99
    mass: 1.0
    hue_shift: on_bounce
    hue_shift_amount: 45
    glow: true
    glow_radius: 30
    glow_intensity: 0.6


# -------------------------------------------------------------------
# TRAILS (disabled for Phase 2)
# -------------------------------------------------------------------

trails:
  enabled: true
  mode: snapshot
  interval: 0.01      # snapshot every 0.2 seconds
  max_count: 999      # keep max 50 per ball

# -------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------

logging:
  level: INFO
  file: "logs/simulation.log"
  console: true
