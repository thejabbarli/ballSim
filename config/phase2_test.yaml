# BallSim Configuration - Phase 2 Test
# Multiple balls with obstacles

# -------------------------------------------------------------------
# SIMULATION SETTINGS
# -------------------------------------------------------------------

simulation:
  duration_seconds: 8
  substeps: 4

# -------------------------------------------------------------------
# OUTPUT SETTINGS
# -------------------------------------------------------------------

output:
  width: 1280
  height: 720
  fps: 60
  path: "output/multi_ball.mp4"
  codec: libx264
  bitrate: "8M"

# -------------------------------------------------------------------
# PHYSICS SETTINGS
# -------------------------------------------------------------------

physics:
  gravity: [0, 980]
  integrator: euler

# -------------------------------------------------------------------
# VISUAL SETTINGS
# -------------------------------------------------------------------

background:
  color: "#000000"

# -------------------------------------------------------------------
# BOUNDARIES
# -------------------------------------------------------------------

boundaries:
  # Outer circle (containment)
  - type: circle
    id: outer_circle
    center: [640, 360]
    radius: 340
    color: "#FFFFFF"
    thickness: 3
    is_containment: true

  # Inner circle obstacle
  - type: circle
    id: inner_obstacle
    center: [640, 360]
    radius: 60
    color: "#e74c3c"
    thickness: 2
    is_containment: false

  # Rectangle obstacle - left
  - type: rectangle
    id: rect_left
    x: 350
    y: 280
    width: 80
    height: 160
    color: "#3498db"
    thickness: 2
    is_containment: false

  # Rectangle obstacle - right
  - type: rectangle
    id: rect_right
    x: 850
    y: 280
    width: 80
    height: 160
    color: "#3498db"
    thickness: 2
    is_containment: false

# -------------------------------------------------------------------
# BALLS
# -------------------------------------------------------------------

balls:
  - id: ball_1
    radius: 20
    color: "#e74c3c"
    position: [500, 100]
    velocity: [200, 50]
    restitution: 0.99
    mass: 1.0
    hue_shift: continuous    # smooth rainbow
    hue_shift_speed: 90      # degrees per second
    outline: true
    outline_color: "#ffffff"
    outline_thickness: 3

  - id: ball_2
    radius: 20
    color: "#2ecc71"
    position: [780, 120]
    velocity: [-150, 80]
    restitution: 0.99
    mass: 1.0
    hue_shift: on_bounce     # changes on collision
    hue_shift_amount: 45     # degrees per bounce
    outline: false
    outline_color: "#ffffff"
    outline_thickness: 3


# -------------------------------------------------------------------
# TRAILS (disabled for Phase 2)
# -------------------------------------------------------------------

trails:
  enabled: true
  mode: snapshot
  interval: 0.02      # snapshot every 0.2 seconds
  max_count: 100      # keep max 50 per ball

# -------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------

logging:
  level: INFO
  file: "logs/simulation.log"
  console: true
